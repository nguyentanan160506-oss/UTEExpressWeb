<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1030" viewBox="0 0 1100 1030" role="img" aria-label="UTEExpressWeb — luồng logistics"><title>UTEExpressWeb — luồng logistics</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#24559a"/></marker></defs><rect width="1100" height="1030" fill="white"/><g font-family="Arial, sans-serif" font-size="18" fill="#18304d"><g><rect x="410" y="25" width="280" height="76" rx="12" fill="#eef5ff" stroke="#24559a"/><text x="550" y="52" text-anchor="middle" font-weight="bold">Quote → CREATED</text><text x="550" y="76" text-anchor="middle" font-size="15">DB price / owner / expiry</text></g><g><rect x="410" y="145" width="280" height="76" rx="12" fill="#eef5ff" stroke="#24559a"/><text x="550" y="172" text-anchor="middle" font-weight="bold">CONFIRMED</text></g><path d="M 550 101 L 550 145" stroke="#24559a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><g><rect x="45" y="270" width="320" height="95" rx="12" fill="#eef5ff" stroke="#24559a"/><text x="205" y="297" text-anchor="middle" font-weight="bold">HOME_PICKUP</text><text x="205" y="321" text-anchor="middle" font-size="15">PICKUP_ASSIGNED → PICKED_UP</text><text x="205" y="343" text-anchor="middle" font-size="15">Courier proof + branch receipt</text></g><g><rect x="735" y="270" width="320" height="95" rx="12" fill="#eef5ff" stroke="#24559a"/><text x="895" y="297" text-anchor="middle" font-weight="bold">BRANCH_DROPOFF</text><text x="895" y="321" text-anchor="middle" font-size="15">Physical branch intake</text></g><path d="M 410 200 L 205 270" stroke="#24559a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 690 200 L 895 270" stroke="#24559a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><g><rect x="410" y="410" width="280" height="76" rx="12" fill="#eef5ff" stroke="#24559a"/><text x="550" y="437" text-anchor="middle" font-weight="bold">AT_ORIGIN_BRANCH</text></g><path d="M 205 365 L 410 440" stroke="#24559a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 895 365 L 690 440" stroke="#24559a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><g><rect x="45" y="545" width="320" height="95" rx="12" fill="#eef5ff" stroke="#24559a"/><text x="205" y="572" text-anchor="middle" font-weight="bold">COLLECTION</text><text x="205" y="596" text-anchor="middle" font-size="15">IN_TRANSIT → AT_ORIGIN_HUB</text></g><g><rect x="390" y="545" width="320" height="95" rx="12" fill="#eef5ff" stroke="#24559a"/><text x="550" y="572" text-anchor="middle" font-weight="bold">LINEHAUL</text><text x="550" y="596" text-anchor="middle" font-size="15">IN_TRANSIT → AT_DESTINATION_HUB</text></g><g><rect x="735" y="545" width="320" height="95" rx="12" fill="#eef5ff" stroke="#24559a"/><text x="895" y="572" text-anchor="middle" font-weight="bold">DISTRIBUTION</text><text x="895" y="596" text-anchor="middle" font-size="15">IN_TRANSIT → destination branch</text></g><path d="M 550 486 L 205 545" stroke="#24559a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 365 590 L 390 590" stroke="#24559a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 710 590 L 735 590" stroke="#24559a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><g><rect x="735" y="700" width="320" height="95" rx="12" fill="#eef5ff" stroke="#24559a"/><text x="895" y="727" text-anchor="middle" font-weight="bold">OUT_FOR_DELIVERY</text><text x="895" y="751" text-anchor="middle" font-size="15">Assign / prepare / accept / start</text></g><path d="M 895 640 L 895 700" stroke="#24559a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><g><rect x="735" y="850" width="320" height="85" rx="12" fill="#eef5ff" stroke="#24559a"/><text x="895" y="877" text-anchor="middle" font-weight="bold">DELIVERED</text><text x="895" y="901" text-anchor="middle" font-size="15">Proof + shipment event</text></g><path d="M 895 795 L 895 850" stroke="#24559a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><g><rect x="390" y="700" width="320" height="95" rx="12" fill="#eef5ff" stroke="#24559a"/><text x="550" y="727" text-anchor="middle" font-weight="bold">DELIVERY_FAILED</text><text x="550" y="751" text-anchor="middle" font-size="15">Attempt + failure reason</text><text x="550" y="773" text-anchor="middle" font-size="15">Redelivery OR return decision</text></g><path d="M 735 745 L 710 745" stroke="#24559a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><g><rect x="45" y="850" width="650" height="105" rx="12" fill="#eef5ff" stroke="#24559a"/><text x="370" y="877" text-anchor="middle" font-weight="bold">RETURNING → RETURNED</text><text x="370" y="901" text-anchor="middle" font-size="15">Recovery + branch receipt → 3 reverse legs → source</text><text x="370" y="923" text-anchor="middle" font-size="15">Sender receipt required; return history preserved</text></g><path d="M 550 795 L 370 850" stroke="#24559a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="550" y="1000" text-anchor="middle" font-size="16">Every trip leg requires manifest, departure and independent receiving receipts.</text><path d="M 600 700 L 600 665 L 800 665 L 800 700" stroke="#24559a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="700" y="658" text-anchor="middle" font-size="14">Redelivery</text></g></svg>
