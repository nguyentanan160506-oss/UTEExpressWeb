spring.application.name=uteexpress

# ==============================================================================
# Microsoft SQL Server Configuration (Development)
# ==============================================================================
spring.datasource.url=jdbc:sqlserver://127.0.0.1:1433;databaseName=UTEExpressDB;encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME:uteexpress_app}
spring.datasource.password=${DB_PASSWORD}

# ==============================================================================
# JPA / Hibernate Configuration
# ==============================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================================
# Flyway Migration Configuration
# ==============================================================================
spring.flyway.enabled=true

# SMTP is optional at startup; registration reports missing configuration explicitly.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
uteexpress.mail.from=${MAIL_FROM:}
spring.mail.default-encoding=UTF-8
spring.mail.properties[mail.smtp.auth]=${MAIL_SMTP_AUTH:true}
spring.mail.properties[mail.smtp.starttls.enable]=${MAIL_STARTTLS:true}
spring.mail.properties[mail.smtp.starttls.required]=${MAIL_STARTTLS:true}
spring.mail.properties[mail.smtp.ssl.enable]=${MAIL_SSL:false}
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
spring.mail.properties[mail.debug]=false
