spring.application.name=uteexpress

# ==============================================================================
# Microsoft SQL Server Configuration (Development)
# ==============================================================================
spring.datasource.url=jdbc:sqlserver://127.0.0.1:1433;databaseName=UTEExpressDB;encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME:uteexpress_app}
spring.datasource.password=${DB_PASSWORD}

# ==============================================================================
# JPA / Hibernate Configuration
# ==============================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================================
# Flyway Migration Configuration
# ==============================================================================
spring.flyway.enabled=true
