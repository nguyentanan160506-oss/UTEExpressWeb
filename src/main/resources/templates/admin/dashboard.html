<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Tổng quan Admin · UTEExpress</title>
    <link rel="stylesheet" th:href="@{/css/vendor/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<nav th:replace="~{admin/fragments :: nav}"></nav>
<main class="container py-4 py-md-5">
    <p class="admin-eyebrow">QUẢN TRỊ HỆ THỐNG</p>
    <h1 class="h3 fw-bold mb-2">Tổng quan tài khoản</h1>
    <p class="text-secondary mb-4">Số liệu tài khoản theo trạng thái hiện tại trong hệ thống.</p>
    <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3"><div class="card border-0 shadow-sm h-100"><div class="card-body">
            <p class="text-secondary">Tổng tài khoản</p><p class="display-6 fw-semibold mb-0" th:text="${stats.total}"></p>
        </div></div></div>
        <div class="col-6 col-lg-3"><div class="card border-0 shadow-sm h-100"><div class="card-body">
            <p class="text-success">ACTIVE</p><p class="display-6 fw-semibold mb-0" th:text="${stats.active}"></p>
        </div></div></div>
        <div class="col-6 col-lg-3"><div class="card border-0 shadow-sm h-100"><div class="card-body">
            <p class="text-warning-emphasis">UNVERIFIED</p><p class="display-6 fw-semibold mb-0" th:text="${stats.unverified}"></p>
        </div></div></div>
        <div class="col-6 col-lg-3"><div class="card border-0 shadow-sm h-100"><div class="card-body">
            <p class="text-secondary">LOCKED</p><p class="display-6 fw-semibold mb-0" th:text="${stats.locked}"></p>
        </div></div></div>
    </div>
    <a th:href="@{/admin/users}" class="btn btn-primary">Quản lý tài khoản</a>
</main>
</body>
</html>
