<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="nav"><div th:replace="~{layout/fragments :: workspace('admin', ~{admin/fragments :: links})}"></div></div>
<th:block th:fragment="links">
    <a th:href="@{/admin}"><svg th:replace="~{layout/fragments :: icon('home')}"></svg>Tổng quan</a>
    <a th:href="@{/admin/users}"><svg th:replace="~{layout/fragments :: icon('users')}"></svg>Tài khoản</a>
    <a th:href="@{/admin/services}"><svg th:replace="~{layout/fragments :: icon('box')}"></svg>Dịch vụ</a>
    <a th:href="@{/admin/pricing}"><svg th:replace="~{layout/fragments :: icon('receipt')}"></svg>Bảng giá</a>
    <a th:href="@{/admin/reports}"><svg th:replace="~{layout/fragments :: icon('chart')}"></svg>Báo cáo</a>
    <a th:href="@{/admin/audit}"><svg th:replace="~{layout/fragments :: icon('check')}"></svg>Audit</a>
</th:block>
<div th:fragment="messages">
    <div th:if="${notice != null}" th:text="${notice}" class="alert alert-success" role="status"></div>
    <div th:if="${error != null}" th:text="${error}" class="alert alert-danger" role="alert"></div>
</div>
</body>
</html>
