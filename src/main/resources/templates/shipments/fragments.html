<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title th:text="${title}"></title>
    <link rel="stylesheet" th:href="@{/css/vendor/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/shipments.css}">
    <th:block th:replace="~{layout/fragments :: assets}"></th:block>
</head>
<body>
<nav th:fragment="nav" th:replace="~{layout/fragments :: customerNav}"></nav>
<span th:fragment="status(value)" class="badge rounded-pill shipment-status"
      th:classappend="${'status-' + value.name().toLowerCase()}" th:text="${statusLabels.get(value)}"></span>
</body>
</html>
