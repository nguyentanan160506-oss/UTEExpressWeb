<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:fragment="head(title)"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title th:text="${title}"></title><link rel="stylesheet" th:href="@{/css/vendor/bootstrap.min.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"><script defer th:src="@{/js/operations.js}"></script><script defer th:src="@{/js/reports.js}"></script>    <th:block th:replace="~{layout/fragments :: assets}"></th:block>
</head><body>
<section th:fragment="bars(title,rows)" class="card card-body h-100"><h2 class="h5" th:text="${title}"></h2><p th:if="${rows.empty}" class="empty-state text-secondary">Chưa có dữ liệu trong tập đang lọc.</p><div th:each="bar : ${rows}" class="mb-3"><div class="d-flex gap-2 justify-content-between"><span class="text-break" th:text="${bar.label}"></span><strong th:text="${bar.value}"></strong></div><div class="progress" aria-hidden="true"><div class="progress-bar" th:style="|width: ${bar.percent}%|"></div></div></div><details th:if="${!rows.empty}"><summary>Số liệu dạng bảng</summary><div class="table-responsive"><table class="table"><caption class="visually-hidden">Bảng dữ liệu và các thao tác tương ứng</caption><thead><tr><th scope="col">Nhóm</th><th scope="col">Số lượng</th></tr></thead><tbody><tr th:each="bar : ${rows}"><td th:text="${bar.label}"></td><td th:text="${bar.value}"></td></tr></tbody></table></div></details></section>
</body></html>
