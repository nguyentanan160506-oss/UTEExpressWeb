<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shipments/fragments :: head('Tạo chuyến vận chuyển')}"></head><body>
<nav th:replace="~{manager/fragments :: nav}"></nav><main class="container py-4">
<div th:replace="~{transport/fragments :: nav}"></div><div th:replace="~{shipper/fragments :: messages}"></div>
<h1 class="h3">Tạo chuyến theo tuyến đã cấu hình</h1>
<p>Chọn tuyến đang hoạt động có điểm xuất phát thuộc phạm vi quản lý. Thêm kiện và niêm phong sau khi tạo chuyến.</p>
<p th:if="${routes.empty}" class="alert alert-warning">Chưa có tuyến hoạt động phù hợp. Cần cấu hình tuyến và liên kết hub hợp lệ trước khi tạo chuyến.</p>
<form th:unless="${routes.empty}" th:action="@{/manager/trips}" method="post" class="card p-3">
    <input type="hidden" name="requestToken" th:value="${requestToken}">
    <label for="routeId" class="form-label">Tuyến vận chuyển</label><select id="routeId" name="routeId" required class="form-select mb-3">
        <option value="">Chọn tuyến</option><option th:each="r : ${routes}" th:value="${r.id}" th:text="|${r.origin} → ${r.destination} · ${legLabels[r.leg]}|"></option></select>
    <button class="btn btn-primary">Tạo chuyến nháp</button></form>
<div th:replace="~{shipper/fragments :: pagination(${routes}, '/manager/trips/new')}"></div>
</main></body></html>
