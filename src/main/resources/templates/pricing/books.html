<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{pricing/fragments :: head('Phiên bản bảng giá')}"></head><body>
<nav th:replace="~{admin/fragments :: nav}"></nav><main class="container py-4"><h1 class="h3">Phiên bản bảng giá</h1><div th:replace="~{admin/fragments :: messages}"></div>
<div class="d-flex gap-3 mb-3"><a th:href="@{/admin/services}">Chọn dịch vụ để tạo bản nháp</a><a th:href="@{/admin/pricing/preview}">Thử tính giá đang hiệu lực</a><a th:if="${serviceId != null}" th:href="@{/admin/pricing/new(serviceId=${serviceId})}">Tạo bản nháp</a></div>
<p th:if="${books.empty}">Chưa có phiên bản; giá legacy không tự được coi là bản đã công bố.</p><article th:each="v : ${books}" class="card p-3 mb-3"><h2 class="h5"><a th:href="@{/admin/pricing/{id}(id=${v.id})}" th:text="|${v.code} · ${v.service}|"></a></h2>
<p th:text="${v.effectiveState}"></p><div th:replace="~{pricing/fragments :: interval(${v.validFrom},${v.validTo})}"></div><p th:if="${v.retiredFrom != null}" th:text="|Ngừng từ ${v.retiredFrom} UTC|"></p></article>
<nav class="d-flex gap-3"><a th:if="${books.hasPrevious()}" th:href="@{/admin/pricing(serviceId=${serviceId},page=${books.number - 1})}">Trang trước</a><a th:if="${books.hasNext()}" th:href="@{/admin/pricing(serviceId=${serviceId},page=${books.number + 1})}">Trang sau</a></nav></main></body></html>
