<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body>
<form th:fragment="shipping(r,v)" method="post" th:action="@{/admin/pricing/{id}/rules(id=${v.id})}" th:with="suffix=${r == null ? 'new' : r.id}">
<input name="expectedVersion" type="hidden" th:value="${v.version}"><input th:if="${r != null}" name="ruleId" type="hidden" th:value="${r.id}">
<label th:for="|scope-${suffix}|" class="form-label">Nhóm giá toàn quốc</label><select th:id="|scope-${suffix}|" name="scope" required class="form-select mb-3"><option value="INTRA_PROVINCE" th:selected="${r == null or r.scope.name() == 'INTRA_PROVINCE'}">Nội tỉnh/thành</option><option value="SAME_REGION" th:selected="${r != null and r.scope.name() == 'SAME_REGION'}">Khác tỉnh cùng miền</option><option value="NORTH_CENTRAL" th:selected="${r != null and r.scope.name() == 'NORTH_CENTRAL'}">Bắc ↔ Trung</option><option value="CENTRAL_SOUTH" th:selected="${r != null and r.scope.name() == 'CENTRAL_SOUTH'}">Trung ↔ Nam</option><option value="NORTH_SOUTH" th:selected="${r != null and r.scope.name() == 'NORTH_SOUTH'}">Bắc ↔ Nam</option></select>
<div class="row g-3 mb-3"><div class="col-12 col-md-6"><label th:for="|base-weight-${suffix}|" class="form-label">Trọng lượng cơ bản (kg)</label><input th:id="|base-weight-${suffix}|" name="baseWeightKg" type="number" required min="0.01" step="0.01" max="99999999.99" th:value="${r == null ? null : r.baseWeightKg}" class="form-control"></div>
<div class="col-12 col-md-6"><label th:for="|base-price-${suffix}|" class="form-label">Giá cơ bản (VND)</label><input th:id="|base-price-${suffix}|" name="basePrice" type="number" required min="0" step="0.01" th:value="${r == null ? null : r.basePrice}" class="form-control"></div>
<div class="col-12 col-md-6"><label th:for="|step-weight-${suffix}|" class="form-label">Bước cân vượt (kg)</label><input th:id="|step-weight-${suffix}|" name="extraWeightStepKg" type="number" required min="0.01" step="0.01" max="99999999.99" th:value="${r == null ? null : r.extraWeightStepKg}" class="form-control"></div>
<div class="col-12 col-md-6"><label th:for="|step-price-${suffix}|" class="form-label">Giá mỗi bước vượt (VND)</label><input th:id="|step-price-${suffix}|" name="extraPricePerStep" type="number" required min="0" step="0.01" th:value="${r == null ? null : r.extraPricePerStep}" class="form-control"></div></div>
<label class="form-check mb-3"><input name="active" value="true" type="checkbox" th:checked="${r == null or r.active}" class="form-check-input">Bật quy tắc trong bản nháp</label><button class="btn btn-outline-primary">Lưu quy tắc nháp</button></form>
<form th:fragment="pickup(r,v,branches)" method="post" th:action="@{/admin/pricing/{id}/pickup-rules(id=${v.id})}" th:with="suffix=${r == null ? 'new' : r.id}">
<input name="expectedVersion" type="hidden" th:value="${v.version}"><input th:if="${r != null}" name="ruleId" type="hidden" th:value="${r.id}">
<label th:for="|pickup-branch-${suffix}|" class="form-label">Phạm vi phụ phí (chi nhánh riêng được ưu tiên)</label><select th:id="|pickup-branch-${suffix}|" name="branchId" class="form-select mb-3"><option value="">Toàn quốc (mặc định)</option><option th:if="${r != null and r.branchId != null}" th:value="${r.branchId}" th:text="${r.branch}" selected></option><option th:each="b : ${branches}" th:if="${r == null or r.branchId != b.id}" th:value="${b.id}" th:text="|${b.name} · ${b.province}|"></option></select>
<label th:for="|pickup-amount-${suffix}|" class="form-label">Phụ phí lấy hàng (VND), phải dương</label><input th:id="|pickup-amount-${suffix}|" name="amount" type="number" min="0.01" step="0.01" required th:value="${r == null ? null : r.amount}" class="form-control mb-3"><label class="form-check mb-3"><input name="active" value="true" type="checkbox" th:checked="${r == null or r.active}" class="form-check-input">Bật phụ phí trong bản nháp</label><button class="btn btn-outline-primary">Lưu phụ phí nháp</button></form>
</body></html>
