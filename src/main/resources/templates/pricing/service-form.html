<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{pricing/fragments :: head('Thông tin dịch vụ')}"></head><body class="workspace-page">
<nav th:replace="~{admin/fragments :: nav}"></nav><main id="main-content" tabindex="-1" class="container py-4"><a th:href="@{/admin/services}">Danh mục dịch vụ</a><h1 class="h3" th:text="${service == null ? 'Tạo dịch vụ mới' : 'Chỉnh sửa dịch vụ'}"></h1>
<div th:replace="~{admin/fragments :: messages}"></div><form method="post" th:action="${service == null} ? @{/admin/services} : @{/admin/services/{id}(id=${service.id})}" th:object="${catalogForm}" class="card p-3">
<input th:if="${service != null}" type="hidden" th:field="*{catalogVersion}"><div th:if="${service == null}" class="mb-3"><label for="code" class="form-label">Mã duy nhất (không thay đổi sau khi tạo)</label><input th:field="*{code}" required maxlength="50" pattern="[A-Z0-9][A-Z0-9_-]{0,49}" class="form-control"></div>
<p th:if="${service != null}" th:text="|Mã cố định: ${service.code}|"></p><label for="name" class="form-label">Tên dịch vụ</label><input th:field="*{name}" required maxlength="100" class="form-control mb-3">
<label for="description" class="form-label">Mô tả / điều kiện công bố</label><textarea th:field="*{description}" maxlength="255" class="form-control mb-3"></textarea>
<label for="estimatedDeliveryHours" class="form-label">Thời gian giao dự kiến (giờ)</label><input th:field="*{estimatedDeliveryHours}" type="number" min="1" required class="form-control mb-3">
<p>Giới hạn tùy chọn; để trống nếu không giới hạn. Nếu đặt giới hạn kích thước, người gửi phải nhập số đo tương ứng.</p>
<div class="row g-3 mb-3"><div class="col-12 col-md-6"><label for="maxWeightKg" class="form-label">Trọng lượng tối đa (kg)</label><input th:field="*{maxWeightKg}" type="number" min="0.01" step="0.01" max="99999999.99" class="form-control"></div>
<div class="col-12 col-md-6"><label for="maxLengthCm" class="form-label">Dài tối đa (cm)</label><input th:field="*{maxLengthCm}" type="number" min="0.01" step="0.01" max="99999999.99" class="form-control"></div>
<div class="col-12 col-md-6"><label for="maxWidthCm" class="form-label">Rộng tối đa (cm)</label><input th:field="*{maxWidthCm}" type="number" min="0.01" step="0.01" max="99999999.99" class="form-control"></div>
<div class="col-12 col-md-6"><label for="maxHeightCm" class="form-label">Cao tối đa (cm)</label><input th:field="*{maxHeightCm}" type="number" min="0.01" step="0.01" max="99999999.99" class="form-control"></div></div>
<p th:if="${service == null}">Dịch vụ mới được tạo ở trạng thái ngừng nhận đơn; cấu hình giá rồi kích hoạt có chủ đích.</p><button class="btn btn-primary">Lưu thông tin</button></form></main></body></html>
