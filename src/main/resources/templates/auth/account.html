<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Tài khoản · UTEExpress</title>
    <link rel="stylesheet" th:href="@{/css/vendor/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <th:block th:replace="~{layout/fragments :: assets}"></th:block>
</head>
<body class="auth-page">
<nav th:replace="~{layout/fragments :: publicNav}"></nav>
<main id="main-content" tabindex="-1" class="container py-5">
    <section class="account-card bg-white rounded-4 shadow-sm p-4 p-md-5 mx-auto">
        <p class="auth-eyebrow mb-2">UTEEXPRESS</p>
        <div class="mb-3"><span th:replace="~{notifications/fragments :: bell}"></span></div>
        <h1 class="h3 fw-bold mb-3">Bạn đã đăng nhập</h1>
        <p class="text-secondary mb-2">Tài khoản đang sử dụng</p>
        <p class="fs-5 fw-semibold text-break" th:text="${email}"></p>
        <div class="d-flex flex-wrap gap-2 mb-4">
            <span th:each="role : ${roles}" class="badge rounded-pill text-bg-light" th:switch="${role}">
                <span th:case="'ROLE_USER'">Khách hàng</span>
                <span th:case="'ROLE_MANAGER'">Quản lý</span>
                <span th:case="'ROLE_SHIPPER'">Nhân viên lấy và giao hàng</span>
                <span th:case="'ROLE_ADMIN'">Quản trị viên</span>
                <span th:case="*" th:text="${role}"></span>
            </span>
        </div>
        <div class="account-actions"><form th:action="@{/logout}" method="post">
            <a th:if="${#lists.contains(roles, 'ROLE_USER')}" th:href="@{/account/profile}" class="btn btn-outline-primary me-2">Hồ sơ và địa chỉ</a>
            <a th:if="${#lists.contains(roles, 'ROLE_USER')}" th:href="@{/account/support}" class="btn btn-outline-primary me-2">Hỗ trợ của tôi</a>
            <a th:if="${#lists.contains(roles, 'ROLE_USER')}" th:href="@{/user/shipments}" class="btn btn-primary me-2">Vận đơn của tôi</a>
            <a th:if="${#lists.contains(roles, 'ROLE_ADMIN')}" th:href="@{/admin}" class="btn btn-primary me-2">Quản trị tài khoản</a>
            <a th:if="${#lists.contains(roles, 'ROLE_MANAGER')}" th:href="@{/manager}" class="btn btn-primary me-2">Vận hành chi nhánh</a>
            <a th:if="${#lists.contains(roles, 'ROLE_SHIPPER')}" th:href="@{/shipper}" class="btn btn-primary me-2">Nhiệm vụ lấy hàng</a>
            <button type="submit" class="btn btn-outline-primary">Đăng xuất</button>
        </form></div>
    </section>
</main>
<footer th:replace="~{layout/fragments :: footer}"></footer>
</body>
</html>
