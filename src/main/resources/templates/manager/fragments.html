<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><body>
<div th:fragment="nav"><div th:replace="~{layout/fragments :: workspace('manager', ~{manager/fragments :: links})}"></div></div>
<th:block th:fragment="links">
    <a th:href="@{/manager}"><svg th:replace="~{layout/fragments :: icon('home')}"></svg>Tổng quan</a>
    <a th:href="@{/manager/operations}"><svg th:replace="~{layout/fragments :: icon('chart')}"></svg>KPI vận hành</a>
    <a th:href="@{/manager/shipments}"><svg th:replace="~{layout/fragments :: icon('box')}"></svg>Yêu cầu gửi hàng</a>
    <a th:href="@{/manager/handoffs}"><svg th:replace="~{layout/fragments :: icon('check')}"></svg>Bàn giao chờ nhận</a>
    <a th:href="@{/manager/trips}"><svg th:replace="~{layout/fragments :: icon('route')}"></svg>Chuyến &amp; hub</a>
    <a th:href="@{/manager/deliveries}"><svg th:replace="~{layout/fragments :: icon('truck')}"></svg>Giao cuối &amp; hoàn</a>
    <a th:href="@{/manager/tickets}"><svg th:replace="~{layout/fragments :: icon('support')}"></svg>Hỗ trợ &amp; khiếu nại</a>
</th:block>
<span th:fragment="method(value)" th:text="${value == null ? 'Chưa xác định (đơn cũ)' : (value.name() == 'HOME_PICKUP' ? 'Lấy hàng tận nhà' : 'Mang đến chi nhánh')}"></span>
</body></html>
